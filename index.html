<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101315">
  <title>ptux shell | Linux im Browser</title>
  <link rel="stylesheet" href="vendor/xterm/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <main class="workspace">
      <section class="map-stage" aria-label="Offline Weltkarte">
        <div class="map-heading">
          <span class="section-label">OFFLINE ATLAS / ROUTE MONITOR</span>
          <strong id="map-status">loading local boundaries...</strong>
        </div>
        <svg id="world-map" viewBox="0 0 1000 560" role="img" aria-label="Linienkarte der Welt mit Netzwerkroute">
          <g id="map-viewport">
            <g id="country-layer"></g>
            <g id="route-layer"></g>
            <g id="city-layer"></g>
          </g>
        </svg>
        <div id="city-tooltip" class="city-tooltip" hidden></div>
        <div class="map-legend"><span><i class="legend-country"></i>countries</span><span><i class="legend-route"></i>active route</span></div>
        <div class="map-controls" aria-label="Kartensteuerung">
          <button id="zoom-in" type="button" title="Hineinzoomen">+</button>
          <button id="zoom-out" type="button" title="Herauszoomen">−</button>
          <button id="zoom-reset" type="button" title="Ansicht zurücksetzen">⌂</button>
        </div>
      </section>
      <section class="terminal-stage" aria-label="Linux Terminal Emulator">
        <div class="terminal-window" id="terminal-window">
          <div class="terminal-titlebar" id="terminal-drag-handle">
            <div class="window-lights" aria-hidden="true"><span></span><span></span><span></span></div>
            <div class="terminal-title"><span class="terminal-lock">⌁</span> guest@ptux: ~</div>
            <button class="reset-button" id="reset-terminal" type="button" title="Session zurücksetzen">RESET <span>↻</span></button>
          </div>
          <div class="terminal-body" id="terminal" role="application" aria-label="Interaktives Linux-Terminal"></div>
        </div>
        <div class="terminal-footer">
          <span><kbd>↑</kbd><kbd>↓</kbd> history</span>
          <span><kbd>Tab</kbd> autocomplete</span>
          <span class="footer-grow"></span>
          <a href="befehle.md">Befehle <span>↗</span></a>
        </div>
      </section>
    </main>
  </div>
  <script src="vendor/xterm/xterm.js"></script>
  <script src="vendor/xterm-addon-fit/xterm-addon-fit.js"></script>
  <script src="main.js"></script>
</body>
</html>
