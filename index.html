<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101315">
  <title>ptux shell | Linux im Browser</title>
  <link rel="stylesheet" href="vendor/xterm/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <main class="workspace">
      <section class="column column-left" aria-label="Informationen">
        <section class="panel panel-info">
          <h2>Infos</h2>
          <div id="server-info" class="server-info" aria-live="polite"><span class="empty-state">Noch kein Server installiert.</span></div>
        </section>
        <section class="panel panel-code">
          <h2>Code</h2>
          <div id="code-output" class="code-output" aria-live="polite" aria-label="Simulierter Installationscode"></div>
        </section>
      </section>
      <section class="column column-center">
        <section class="panel panel-route" aria-label="Route Monitor">
          <div class="map-stage">
            <svg id="world-map" viewBox="0 0 1000 560" role="img" aria-label="Linienkarte der Welt mit Netzwerkroute">
              <g id="map-viewport">
                <g id="country-layer"></g>
                <g id="route-layer"></g>
                <g id="server-layer"></g>
              </g>
            </svg>
            <div class="map-controls" aria-label="Kartensteuerung">
              <button id="zoom-in" type="button" title="Hineinzoomen">+</button>
              <button id="zoom-out" type="button" title="Herauszoomen">−</button>
              <button id="zoom-reset" type="button" title="Ansicht zurücksetzen">⌂</button>
            </div>
          </div>
        </section>
        <section class="panel panel-terminal" aria-label="Linux Terminal Emulator">
          <div class="terminal-window">
            <div class="terminal-body" id="terminal" role="application" aria-label="Interaktives Linux-Terminal"></div>
          </div>
        </section>
      </section>
      <section class="column column-right" aria-label="Systemstatus">
        <section class="panel panel-ai"><h2>PTuX-KI</h2></section>
        <section class="panel panel-safe"><h2>IP-Safe</h2></section>
        <section class="panel panel-warnings"><h2>Warnungen</h2></section>
      </section>
    </main>
  </div>
  <script src="vendor/xterm/xterm.js"></script>
  <script src="vendor/xterm-addon-fit/xterm-addon-fit.js"></script>
  <script src="main.js"></script>
</body>
</html>
