<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101315">
  <title>ptux shell | Linux im Browser</title>
  <link rel="stylesheet" href="vendor/xterm/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="." aria-label="ptux shell Startseite">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>ptux<span class="brand-slash">/</span>shell</span>
      </a>
      <div class="topbar-meta">
        <span class="status"><span class="status-dot"></span>session active</span>
        <span class="version">v1.0.0</span>
      </div>
    </header>

    <main class="workspace">
      <aside class="sidebar">
        <div class="side-intro">
          <span class="section-label">LOCAL SESSION</span>
          <h1>Linux,<br><em>im Browser.</em></h1>
          <p>Eine kleine Shell-Simulation für neugierige Finger und schnelle Experimente.</p>
        </div>

        <div class="quick-section">
          <div class="section-heading">
            <span class="section-label">QUICK COMMANDS</span>
            <span class="key-hint">RUN</span>
          </div>
          <div class="command-list">
            <button class="command-button" type="button" data-command="help"><span class="command-prompt">$</span><span>help</span><span class="command-arrow">↗</span></button>
            <button class="command-button" type="button" data-command="ls -la"><span class="command-prompt">$</span><span>ls -la</span><span class="command-arrow">↗</span></button>
            <button class="command-button" type="button" data-command="neofetch"><span class="command-prompt">$</span><span>neofetch</span><span class="command-arrow">↗</span></button>
            <button class="command-button" type="button" data-command="cat readme.txt"><span class="command-prompt">$</span><span>cat readme.txt</span><span class="command-arrow">↗</span></button>
          </div>
        </div>

        <div class="sidebar-foot">
          <div class="fact-row"><span>HOST</span><strong>ptux.local</strong></div>
          <div class="fact-row"><span>SHELL</span><strong>bash-like</strong></div>
          <div class="fact-row"><span>MODE</span><strong class="offline-label"><span></span>offline</strong></div>
        </div>
      </aside>

      <section class="terminal-stage" aria-label="Linux Terminal Emulator">
        <div class="terminal-window">
          <div class="terminal-titlebar">
            <div class="window-lights" aria-hidden="true"><span></span><span></span><span></span></div>
            <div class="terminal-title"><span class="terminal-lock">⌁</span> guest@ptux: ~</div>
            <button class="reset-button" id="reset-terminal" type="button" title="Session zurücksetzen">RESET <span>↻</span></button>
          </div>
          <div class="terminal-body" id="terminal" role="application" aria-label="Interaktives Linux-Terminal"></div>
        </div>
        <div class="terminal-footer">
          <span><kbd>↑</kbd><kbd>↓</kbd> history</span>
          <span><kbd>Tab</kbd> autocomplete</span>
          <span class="footer-grow"></span>
          <a href="befehle.md">Befehle <span>↗</span></a>
        </div>
      </section>
    </main>
  </div>
  <script src="vendor/xterm/xterm.js"></script>
  <script src="vendor/xterm-addon-fit/xterm-addon-fit.js"></script>
  <script src="main.js"></script>
</body>
</html>
